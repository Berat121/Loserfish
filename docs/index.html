<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Loserfish: an engine that wants to be checkmated</title>
<link rel="modulepreload" href="vendor/chess.js">
<style>
:root {
  --bs: min(calc(100vw - 64px), 84vh, 620px);
  --bg: #161512; --card: #262421; --card2: #2e2c29; --line: #3a3835; --fg: #e8e6e1; --muted: #a09d96;
  --accent: #6fa83a; --accent-fg: #0f1a06; --warn: #e0a526;
  --light: #f0d9b5; --dark: #b58863;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #ecebe8; --card: #fff; --card2: #f4f3f0; --line: #d9d7d2; --fg: #1f1e1c; --muted: #6a6862; --accent: #4f8a1e; --accent-fg: #fff; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 14px 14px 28px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: .92rem; }
#banner { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--warn); border-radius: 8px; background: rgba(224, 165, 38, .12); }
#banner button { margin-left: 8px; padding: 3px 10px; }
#banner[hidden], #promo[hidden], #now[hidden] { display: none; }
.app { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.stage { display: flex; gap: 8px; }
#evalbar { position: relative; width: 22px; height: var(--bs); border-radius: 6px; overflow: hidden; background: #2b2b2b; flex: none; transition: opacity .2s; }
#evalbar.off { opacity: .25; }
#evalfill { position: absolute; inset: 0; background: #f2f2f2; transform-origin: 50% 100%; transform: scaleY(.5); transition: transform .35s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
#evalbar.flip #evalfill { background: #2b2b2b; }
#evalbar.flip { background: #f2f2f2; }
#evaltext { position: absolute; left: 0; right: 0; text-align: center; font: 600 10px/1 system-ui, sans-serif; z-index: 1; pointer-events: none; }
#board { position: relative; width: var(--bs); height: var(--bs); flex: none; border-radius: 6px; overflow: hidden; user-select: none; -webkit-user-select: none;
  touch-action: none; contain: layout paint size; box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
  background: conic-gradient(var(--dark) 25%, var(--light) 0 50%, var(--dark) 0 75%, var(--light) 0) 0 0 / 25% 25%; }
#board.noanim .p { transition: none !important; }
#hl, #pieces, #coords { position: absolute; inset: 0; pointer-events: none; }
#hl { z-index: 1; } #pieces { z-index: 2; } #coords { z-index: 3; }
.hl { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; }
.hl.sel { background: rgba(20, 85, 30, .5); }
.hl.last { background: rgba(155, 199, 0, .41); }
.hl.dest { background: radial-gradient(rgba(20, 85, 30, .5) 19%, rgba(0, 0, 0, 0) 20%); }
.hl.dest.cap { background: radial-gradient(transparent 0%, transparent 79%, rgba(20, 85, 30, .3) 80%); }
.hl.dest.over { background: rgba(20, 85, 30, .3); }
.hl.chk { background: radial-gradient(ellipse at center, rgba(255, 0, 0, 1) 0%, rgba(231, 0, 0, 1) 25%, rgba(169, 0, 0, 0) 89%, rgba(158, 0, 0, 0) 100%); }
.p { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; background-size: 100%; background-repeat: no-repeat;
  will-change: transform; transition: transform .16s ease-out; }
.p.dragging { transition: none; z-index: 10; }
.p.ghost { opacity: .3; transition: none; }
.co { position: absolute; font: 600 clamp(8px, calc(var(--bs) / 56), 12px)/1 system-ui, sans-serif; opacity: .9; }
.co.l { color: var(--light); } .co.d { color: var(--dark); }
aside { flex: 1 1 290px; min-width: 260px; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.pill { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.think { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
.dot.over { background: var(--muted); }
@keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
#info { color: var(--muted); font-size: .88rem; margin-top: 4px; min-height: 1.3em; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
.grid label { color: var(--muted); font-size: .9rem; }
.hint { grid-column: 1 / -1; color: var(--muted); font-size: .82rem; line-height: 1.4; margin-top: -2px; }
select, button { font: inherit; color: var(--fg); background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
select { width: 100%; }
button { cursor: pointer; transition: background .12s, border-color .12s, transform .06s; }
button:hover { border-color: var(--muted); } button:active { transform: translateY(1px); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.row { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.row button { flex: 1 1 auto; }
#toast { color: var(--muted); font-size: .82rem; min-height: 1.1em; grid-column: 1 / -1; }
#moves { margin: 0; padding: 0; list-style: none; max-height: 190px; overflow: auto; font: .88rem ui-monospace, SFMono-Regular, Menlo, monospace; }
#moves li { display: grid; grid-template-columns: 2.6em 1fr 1fr; padding: 1px 0; }
#moves li span:first-child { color: var(--muted); }
#promo { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; z-index: 50; }
#promo div { background: var(--card); padding: 12px; border-radius: 12px; display: flex; gap: 8px; }
#promo button { width: 76px; height: 76px; padding: 0; position: relative; }
#promo .pc { position: absolute; inset: 0; background-size: 100%; background-repeat: no-repeat; }
footer { margin-top: 6px; color: var(--muted); font-size: .8rem; }
footer a { color: inherit; }
.wK { background-image: url(pieces/cburnett/wK.svg); }
.wQ { background-image: url(pieces/cburnett/wQ.svg); }
.wR { background-image: url(pieces/cburnett/wR.svg); }
.wB { background-image: url(pieces/cburnett/wB.svg); }
.wN { background-image: url(pieces/cburnett/wN.svg); }
.wP { background-image: url(pieces/cburnett/wP.svg); }
.bK { background-image: url(pieces/cburnett/bK.svg); }
.bQ { background-image: url(pieces/cburnett/bQ.svg); }
.bR { background-image: url(pieces/cburnett/bR.svg); }
.bB { background-image: url(pieces/cburnett/bB.svg); }
.bN { background-image: url(pieces/cburnett/bN.svg); }
.bP { background-image: url(pieces/cburnett/bP.svg); }
</style>
</head>
<body>
<main>
  <header><h1>Loserfish</h1><span class="sub">A Stockfish-derived engine that tries to get checkmated. Your challenge: do not mate it.</span></header>
  <div id="banner" hidden></div>
  <div class="app">
    <div class="stage">
      <div id="evalbar" class="off" title="Evaluation of the engine's last search"><div id="evalfill"></div><span id="evaltext"></span></div>
      <div id="board" role="application" aria-label="Chess board"><div id="hl"></div><div id="pieces"></div><div id="coords"></div></div>
    </div>
    <aside>
      <div class="card"><div class="pill"><span class="dot" id="dot"></span><span id="status">Loading engine...</span></div><div id="info"></div></div>
      <div class="card grid">
        <label for="side">You play</label>
        <select id="side"><option value="white">White</option><option value="black">Black</option></select>
        <label for="limit">Think limit</label>
        <select id="limit">
          <option value="t300">0.3 s</option><option value="t1000" selected>1 s</option><option value="t3000">3 s</option>
          <option value="d6">Depth 6</option><option value="d8">Depth 8</option><option value="d10">Depth 10 (slow)</option>
        </select>
        <label for="mode">Opponent model</label>
        <select id="mode"><option value="adversarial">Adversarial</option><option value="cooperative">Cooperative</option></select>
        <div class="hint" id="modehint"></div>
        <label for="eval">Eval</label>
        <select id="eval"><option value="inverted" selected>Inverted</option><option value="natural">Natural</option><option value="off">Off</option></select>
        <div class="hint" id="evalhint"></div>
        <div class="row"><button id="new" class="primary" type="button">New game</button><button id="undo" type="button">Undo</button><button id="now" type="button" hidden>Move now</button></div>
        <div class="row"><button id="pgn" type="button">Export PGN</button><button id="copy" type="button">Copy PGN</button></div>
        <div id="toast"></div>
      </div>
      <div class="card"><ol id="moves"></ol></div>
    </aside>
  </div>
  <div id="promo" hidden><div></div></div>
  <footer>
    <a href="https://github.com/Berat121/Loserfish">Source on GitHub</a> (GPLv3). The engine runs in your browser as WebAssembly.
    Pieces: <a href="pieces/cburnett/NOTICE.txt">cburnett</a> by Colin M.L. Burnett (GPLv2+). Uses <a href="vendor/chess.js.LICENSE">chess.js</a> (BSD-2) and
    <a href="vendor/coi-serviceworker.LICENSE">coi-serviceworker</a> (MIT).
  </footer>
</main>
<script>
window.coi = {
  coepCredentialless: function () { return false; },
  // coi-serviceworker can call doReload twice (updatefound and active-but-uncontrolled); the second reload aborts the first navigation.
  doReload: (function () { var done = false; return function () { if (done) return; done = true; window.location.reload(); }; })()
};
</script>
<script src="coi-serviceworker.js"></script>
<script src="loserfish.js"></script>
<script type="module" src="app.js?v=7"></script>
</body>
</html>
